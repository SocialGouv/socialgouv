name: Containers cleaner

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 2 * * *'

permissions:
  id-token: write  # Required for OIDC token generation

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:

    - name: Get GitHub App Token
      id: token
      uses: SocialGouv/token-bureau@main
      with:
        token-bureau-url: https://token-bureau.fabrique.social.gouv.fr
        audience: socialgouv

    - uses: socialgouv/actions/containers-list@v1
      id: list
      with:
        organization: socialgouv

    - name: debug
      run: |
        echo "${{ steps.list.outputs.containers }}"

    - uses: socialgouv/actions/containers-cleaner@v1
      with:
        organization: socialgouv
        token: ${{ steps.token.outputs.token }}
        retention-weeks: '2'
        protected-tags: |
          ^main$
          ^master$
          ^dev$
          ^prod$
          ^latest$
          ^preprod$
          ^preprod-(\w+)$
          ^persist-(\w+)$
          ^prod-(\w+)$
          ^beta-(\w+)$
          ^(\d+)$
          ^(\d+\.\d+)(\.\d+)?(-(alpha|beta).\d+)?$
          ^v(\d+)$
          ^v(\d+\.\d+)(\.\d+)?(-(alpha|beta).\d+)?$
        containers: |
          ${{ steps.list.outputs.containers }}
